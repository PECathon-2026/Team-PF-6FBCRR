<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetic Store — Checkout</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
        .container { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #38bdf8; font-size: 24px; }
        .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #334155; }
        .form-group { margin-top: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
        input { width: 100%; box-sizing: border-box; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 14px; }
        .row { display: flex; gap: 12px; }
        .btn { display: inline-block; width: 100%; margin-top: 24px; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn:hover { background: #0369a1; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .summary-box { display: none; background: #0f172a; padding: 16px; border-radius: 8px; margin-top: 20px; border: 1px solid #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secure Checkout</h1>
        <div class="item">
            <span>Privacy Security Key Hardware Device</span>
            <strong>₹2,499.00</strong>
        </div>

        <form id="checkoutForm" onsubmit="event.preventDefault(); proceedToReview();">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Recipient full name" required>
            </div>

            <div class="form-group">
                <label for="address">Shipping Address</label>
                <input type="text" id="address" name="address" placeholder="Street, City, Pincode" required>
            </div>

            <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="16-digit card number" required>
            </div>

            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label for="expiry">Expiry (MM/YY)</label>
                    <input type="text" id="expiry" name="expiry" placeholder="12/28" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" name="cvv" placeholder="•••" maxlength="4" required>
                </div>
            </div>

            <button type="submit" id="reviewBtn" class="btn">Review Order</button>
        </form>

        <div id="summaryBox" class="summary-box">
            <h2 style="font-size: 18px; margin-top: 0; color: #38bdf8;">Order Summary & Confirmation</h2>
            <p>Shipping to: <span id="summaryName"></span></p>
            <p>Address: <span id="summaryAddress"></span></p>
            <p>Payment: Card ending in <span id="summaryCardEnd"></span></p>
            <p>Total: <strong>₹2,499.00</strong></p>
            <button id="confirmPurchaseBtn" class="btn btn-success" onclick="alert('Purchase finalized!')">Confirm and Pay ₹2,499.00</button>
        </div>
    </div>

    <script>
        function proceedToReview() {
            const name = document.getElementById('fullName').value;
            const addr = document.getElementById('address').value;
            const card = document.getElementById('cardNumber').value;
            
            document.getElementById('summaryName').innerText = name;
            document.getElementById('summaryAddress').innerText = addr;
            document.getElementById('summaryCardEnd').innerText = card.slice(-4) || '••••';
            
            document.getElementById('checkoutForm').style.display = 'none';
            document.getElementById('summaryBox').style.display = 'block';
            document.title = "Order Summary — Review";
        }
    </script>
</body>
</html>
