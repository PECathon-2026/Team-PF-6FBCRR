<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal — Sign In</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f1f5f9; margin: 0; padding: 40px 20px; }
        .auth-card { max-width: 420px; margin: 0 auto; background: #131b2e; padding: 32px; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h1 { font-size: 22px; color: #60a5fa; margin-top: 0; text-align: center; }
        .form-group { margin-top: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; }
        .btn { display: block; width: 100%; margin-top: 24px; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        #otpStep, #dashboardStep { display: none; }
        .badge { display: inline-block; padding: 4px 10px; background: #065f46; color: #34d399; border-radius: 20px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div id="loginStep">
            <h1>Sign in to SecureCorp</h1>
            <form onsubmit="event.preventDefault(); showOtp();">
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" name="email" placeholder="name@securecorp.local" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••••••" required>
                </div>
                <button type="submit" id="signInBtn" class="btn">Sign In</button>
            </form>
        </div>

        <div id="otpStep">
            <h1>Two-Factor Verification</h1>
            <p style="font-size: 13px; color: #94a3b8; text-align: center;">Enter the 6-digit OTP code sent to your authenticator app.</p>
            <form onsubmit="event.preventDefault(); showDashboard();">
                <div class="form-group">
                    <label for="otpCode">Verification Passcode (OTP)</label>
                    <input type="text" id="otpCode" name="otpCode" placeholder="6-digit OTP" maxlength="8" required>
                </div>
                <button type="submit" id="verifyOtpBtn" class="btn">Verify Code</button>
            </form>
        </div>

        <div id="dashboardStep">
            <h1>Account Dashboard</h1>
            <div style="text-align: center; margin-top: 20px;">
                <span class="badge">Authenticated Session Active</span>
                <p style="margin-top: 14px; font-size: 14px; color: #cbd5e1;">Welcome, <span id="userDisplay">alice.developer@securecorp.local</span>!</p>
                <p style="font-size: 12px; color: #64748b;">Enterprise Access Level: Level 3 Administrator</p>
            </div>
        </div>
    </div>

    <script>
        function showOtp() {
            document.getElementById('loginStep').style.display = 'none';
            document.getElementById('otpStep').style.display = 'block';
            document.title = "Enterprise Portal — Two-Factor Verification";
        }
        function showDashboard() {
            document.getElementById('otpStep').style.display = 'none';
            document.getElementById('dashboardStep').style.display = 'block';
            document.title = "Enterprise Portal — Account Dashboard";
        }
    </script>
</body>
</html>
